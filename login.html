<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Login - Online Brain Hub</title>
  <style>
    :root { --bg: #1e272e; --panel: #2d3436; --primary: #0984e3; --accent: #fdcb6e; --text: #f5f6fa; --success: #00b894;}
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .login-card { background: var(--panel); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
    h1 { margin-top: 0; color: var(--primary); }
    .toggle-btn { background: none; border: none; color: #b2bec3; cursor: pointer; margin-bottom: 5px; font-weight: bold; text-decoration: underline; }
    .recovery-btn { font-size: 0.8em; color: #ff7675; margin-bottom: 20px; display: block; }
    input, select { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: none; background: #353b48; color: white; font-size: 1em; box-sizing: border-box; }
    .play-btn { background: var(--accent); color: #2d3436; border: none; padding: 15px; width: 100%; font-size: 1.2em; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 15px; }
    #error-msg { color: #ff7675; font-weight: bold; margin-bottom: 15px; min-height: 20px; }
    .cf-turnstile { margin-bottom: 15px; display: flex; justify-content: center; }
    .recovery-box { display: none; background: #000; border: 2px dashed var(--success); padding: 20px; border-radius: 10px; margin-top: 20px; }
    .recovery-code { color: var(--success); font-size: 1.5em; font-weight: bold; letter-spacing: 2px; margin: 10px 0; display: block;}
    .hint-text { font-size: 0.8em; color: #b2bec3; text-align: left; margin-bottom: 5px; display: block; }
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

  <div class="login-card" id="main-form">
    <h1 id="form-title">Login</h1>
    <button class="toggle-btn" onclick="setMode('register')" id="toggle-register">Create Account</button>
    <button class="toggle-btn" onclick="setMode('login')" id="toggle-login" style="display:none;">Back to Login</button>
    <button class="toggle-btn recovery-btn" onclick="setMode('recover')" id="toggle-recover">Forgot Password?</button>
    
    <div id="error-msg"></div>

    <input type="text" id="username" placeholder="Username" autocomplete="off">
    
    <!-- Registration Only -->
    <select id="hint-question" style="display: none;">
      <option value="pet">What was the name of your first pet?</option>
      <option value="hero">Who is your favorite superhero?</option>
      <option value="city">In what city were you born?</option>
    </select>
    <input type="text" id="hint-answer" placeholder="Hint Answer" style="display: none;" autocomplete="off">
    
    <!-- Recovery Only -->
    <span id="recover-instructions" class="hint-text" style="display:none;">Enter EITHER your Hint Answer OR your Recovery Key:</span>
    <input type="text" id="recovery-key" placeholder="Recovery Key (OBH-XXXX-XXXX)" style="display: none;" autocomplete="off">

    <!-- Login / Register / Recover -->
    <input type="password" id="password" placeholder="Password" autocomplete="off">

    <!-- REPLACE WITH YOUR ACTUAL SITE KEY -->
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFbcYm7KvA_fcQaa" data-theme="dark"></div>

    <button class="play-btn" id="submit-btn" onclick="submitAuth()">Login ➔</button>
  </div>

  <div class="login-card" id="success-screen" style="display:none;">
    <h1 style="color: var(--success)">Account Created!</h1>
    <p>If you forget your password and hint answer, you will need this exact key to reset it.</p>
    <div class="recovery-box" style="display: block;">
      Save this securely:
      <span class="recovery-code" id="new-recovery-key"></span>
    </div>
    <button class="play-btn" onclick="goToHub()" style="margin-top: 30px;">I saved it. Let's Play! ➔</button>
  </div>

  <script>
    let currentMode = 'login';

    // CRITICAL FIX: Ensure we check the exact key the rest of the site uses
    if (localStorage.getItem('brainhub_username')) {
      window.location.href = '/';
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('error-msg').innerText = "";
      
      const isLog = mode === 'login';
      const isReg = mode === 'register';
      const isRec = mode === 'recover';

      document.getElementById('form-title').innerText = isReg ? "Register" : (isRec ? "Reset Password" : "Login");
      
      document.getElementById('toggle-register').style.display = (isLog || isRec) ? "block" : "none";
      document.getElementById('toggle-login').style.display = (isReg || isRec) ? "block" : "none";
      document.getElementById('toggle-recover').style.display = isLog ? "block" : "none";
      
      document.getElementById('hint-question').style.display = isReg ? "block" : "none";
      document.getElementById('hint-answer').style.display = (isReg || isRec) ? "block" : "none";
      document.getElementById('hint-answer').placeholder = isRec ? "Hint Answer (Optional if using Key)" : "Hint Answer";
      
      document.getElementById('recover-instructions').style.display = isRec ? "block" : "none";
      document.getElementById('recovery-key').style.display = isRec ? "block" : "none";
      
      document.getElementById('password').placeholder = isRec ? "New Password" : "Password";
      document.getElementById('submit-btn').innerText = isRec ? "Reset Password" : (isReg ? "Register" : "Login ➔");
    }

    async function submitAuth() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const hintQuestion = document.getElementById('hint-question').value;
      const hintAnswer = document.getElementById('hint-answer').value.trim();
      const recoveryKey = document.getElementById('recovery-key').value.trim();
      const turnstileToken = document.querySelector('[name="cf-turnstile-response"]')?.value;

      if (!username || !password) {
        document.getElementById('error-msg').innerText = "Username and Password are required.";
        return;
      }
      if (currentMode === 'register' && !hintAnswer) {
        document.getElementById('error-msg').innerText = "Please provide a hint answer.";
        return;
      }
      if (currentMode === 'recover' && !hintAnswer && !recoveryKey) {
        document.getElementById('error-msg').innerText = "Provide your Hint Answer or Recovery Key.";
        return;
      }
      if (!turnstileToken) {
        document.getElementById('error-msg').innerText = "Please wait for the bot check.";
        return;
      }

      document.getElementById('error-msg').innerText = "Connecting...";

      try {
        const payload = { action: currentMode, username, turnstileToken };
        
        if (currentMode === 'login') {
          payload.password = password;
        } else if (currentMode === 'register') {
          payload.password = password;
          payload.hintQuestion = hintQuestion;
          payload.hintAnswer = hintAnswer;
        } else if (currentMode === 'recover') {
          payload.newPassword = password;
          payload.hintAnswer = hintAnswer;
          payload.recoveryKey = recoveryKey;
        }

        const res = await fetch('/api/user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (result.success) {
          // CRITICAL FIX:  Storing the username with the 'brainhub_username' key exactly as index.html expects
          localStorage.setItem('brainhub_username', result.username);
          localStorage.setItem('brainhub_xp', result.xp);
          
          // Optionally clean up the old incorrect key if it exists
          localStorage.removeItem('obh_username');
          
          if (currentMode === 'register') {
            document.getElementById('main-form').style.display = 'none';
            document.getElementById('success-screen').style.display = 'block';
            document.getElementById('new-recovery-key').innerText = result.recoveryKey;
          } else {
            window.location.href = '/';
          }
        } else {
          document.getElementById('error-msg').innerText = result.error;
          turnstile.reset();
        }
      } catch (err) {
        document.getElementById('error-msg').innerText = "Server error. Try again.";
      }
    }

    function goToHub() { window.location.href = '/'; }
  </script>
</body>
</html>
