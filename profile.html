<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Profile - Online Brain Hub</title>
  <style>
    :root { --bg: #1e272e; --panel: #2d3436; --primary: #0984e3; --accent: #fdcb6e; --text: #f5f6fa; --danger: #ff7675; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    
    /* Top Navigation Bar */
    .top-nav { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 20px auto; }
    .logout-btn { background: rgba(255, 118, 117, 0.1); color: var(--danger); border: 1px solid var(--danger); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
    .logout-btn:hover { background: var(--danger); color: white; }

    .header { text-align: center; margin-bottom: 40px; }
    .username { font-size: 2.5em; color: var(--primary); margin: 0; text-transform: uppercase; letter-spacing: 2px;}
    .total-xp { font-size: 1.5em; color: var(--accent); font-weight: bold; margin-top: 10px;}
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
    .subject-card { background: var(--panel); padding: 20px; border-radius: 15px; box-shadow: 0 8px 0 rgba(0,0,0,0.2); }
    .subject-title { border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-top: 0; color: #00cec9; }
    
    .topic-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px;}
    .topic-name { font-weight: bold; font-size: 1.1em; }
    
    /* New Gamification Badges */
    .topic-metrics { display: flex; gap: 10px; margin-top: 8px; }
    .metric-badge { background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px; font-size: 0.85em; color: #b2bec3; }
    .best-score { color: #a29bfe; font-weight: bold; }
    
    .topic-stats { color: var(--accent); font-weight: bold; display: block; text-align: right; font-size: 1.1em;}
    .topic-plays { font-size: 0.8em; color: #b2bec3; display: block; text-align: right; margin-top: 4px;}
    
    .back-btn { display: block; width: 200px; margin: 40px auto; background: rgba(255,255,255,0.1); text-align: center; padding: 15px; border-radius: 30px; text-decoration: none; color: white; font-weight: bold; }
    .back-btn:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="/" style="color: white; text-decoration: none; font-weight: bold;">🏠 Hub</a>
    <button class="logout-btn" onclick="logoutPlayer()">Log Out</button>
  </div>

  <div class="header">
    <h1 class="username" id="display-name">Loading Profile...</h1>
   <div class="total-xp">
  ⭐ <span id="display-xp">0</span> Total XP 
  <span style="color: rgba(255,255,255,0.3); margin: 0 10px;">|</span> 
  <span style="color: #00cec9;">Level <span id="display-level">1</span></span>
</div>
  </div>

  <div class="stats-grid" id="stats-container">
    <!-- Progress cards will be generated here -->
  </div>

  <a href="/" class="back-btn">← Back to Hub</a>

  <script>
    function logoutPlayer() {
      localStorage.removeItem('obh_username');
      localStorage.removeItem('brainhub_xp');
      window.location.href = '/login.html';
    }

    async function loadProfile() {
      const username = localStorage.getItem('obh_username');
      if (!username) {
        window.location.href = '/login.html';
        return;
      }

      document.getElementById('display-name').innerText = username;

      try {
        const res = await fetch('/api/user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'get_profile', username: username })
        });
        const data = await res.json();

   if (data.success) {
          document.getElementById('display-xp').innerText = data.xp;
          // Calculate Level: Every 100 XP = 1 Level Up!
          document.getElementById('display-level').innerText = Math.floor(data.xp / 100) + 1; 
          renderStats(data.progress);
        }
      } catch (e) {
        document.getElementById('stats-container').innerHTML = "<p style='text-align:center'>Failed to load stats.</p>";
      }
    }

    function renderStats(progressObj) {
      const container = document.getElementById('stats-container');
      container.innerHTML = '';

      for (const [subject, topics] of Object.entries(progressObj)) {
        let cardHtml = `<div class="subject-card">
                          <h2 class="subject-title">${subject} Mastery</h2>`;
        
        for (const [topic, stats] of Object.entries(topics)) {
          // Parse the new data (with fallbacks for older gameplay saves)
          const scoreString = (stats.best_score !== undefined) ? `${stats.best_score}/${stats.best_score_total}` : "Unranked";
          const maxHearts = stats.max_hearts || 0;
          const heartDisplay = maxHearts > 0 ? "❤️".repeat(maxHearts) : "💔";

          cardHtml += `
            <div class="topic-row">
              <div>
                <div class="topic-name">${topic}</div>
                <div class="topic-metrics">
                  <span class="metric-badge best-score">🏆 Best: ${scoreString}</span>
                  <span class="metric-badge">Health: ${heartDisplay}</span>
                </div>
              </div>
              <div>
                <span class="topic-stats">${stats.xp} XP</span>
                <span class="topic-plays">${stats.plays} Plays</span>
              </div>
            </div>
          `;
        }
        cardHtml += `</div>`;
        container.innerHTML += cardHtml;
      }

      if (container.innerHTML === '') {
        container.innerHTML = "<p style='text-align:center; color:#b2bec3; width:100%;'>Play some games to start tracking your mastery!</p>";
      }
    }

    loadProfile();
  </script>
</body>
</html>
