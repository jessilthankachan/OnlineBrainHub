<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Mode - Online Brain Hub</title>
  <!-- MathJax for formulas -->
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    :root {
      --bg-color: #1e272e;
      --panel-bg: #2d3436;
      --primary: #0984e3;
      --success: #00b894;
      --danger: #d63031;
      --text: #f5f6fa;
      --accent: #fdcb6e;
    }
    
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden;}
    
    /* Game HUD (Heads Up Display) */
    .hud { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); border-bottom: 2px solid rgba(255,255,255,0.1);}
    .hud-item { font-size: 1.2em; font-weight: bold; display: flex; align-items: center; gap: 8px;}
    .lives { color: #ff7675; letter-spacing: 2px; }
    .score { color: var(--accent); }
    .quit-btn { background: none; border: none; color: #b2bec3; cursor: pointer; font-size: 1em; font-weight: bold;}
    .quit-btn:hover { color: white; }

    /* Level Progress Bar */
    .progress-container { width: 100%; height: 8px; background: #636e72; }
    .progress-bar { height: 100%; width: 0%; background: var(--success); transition: width 0.3s ease; }

    /* Game Stage */
    .stage { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .game-card { background: var(--panel-bg); width: 100%; max-width: 700px; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; position: relative;}
    
    .meta-tag { font-size: 0.85em; color: #b2bec3; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; display: block;}
    .question-text { font-size: 1.6em; font-weight: 700; margin-bottom: 30px; line-height: 1.4;}
    
    /* Options Grid */
    .options-grid { display: grid; gap: 15px; grid-template-columns: 1fr; }
    @media(min-width: 600px) { .options-grid { grid-template-columns: 1fr 1fr; } }
    
    .option-btn { background: #353b48; color: white; border: 2px solid #40739e; padding: 18px; border-radius: 12px; font-size: 1.1em; font-weight: 600; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 0 #273c75;}
    .option-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 #273c75; background: #2f3640;}
    .option-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
    
    /* Game States */
    .correct { background: var(--success) !important; border-color: #00cec9 !important; box-shadow: 0 4px 0 #0097e6 !important; animation: pop 0.3s ease; }
    .wrong { background: var(--danger) !important; border-color: #c0392b !important; box-shadow: 0 4px 0 #a93226 !important; animation: shake 0.4s ease; opacity: 0.7;}
    
    .feedback-panel { margin-top: 30px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 12px; display: none; text-align: left; border-left: 4px solid var(--accent);}
    .next-btn { margin-top: 20px; background: var(--primary); color: white; border: none; padding: 15px 30px; font-size: 1.2em; border-radius: 30px; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 4px 0 #273c75;}
    .next-btn:hover { background: #0097e6; }

    /* End Screen */
    #end-screen { display: none; }
    .reward-icon { font-size: 5em; margin-bottom: 10px; animation: bounce 2s infinite; }

    /* Animations */
    @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }
    @keyframes pop { 0% {transform: scale(1);} 50% {transform: scale(1.05);} 100% {transform: scale(1);} }
    @keyframes bounce { 0%, 100% {transform: translateY(0);} 50% {transform: translateY(-20px);} }
  </style>
</head>
<body>

  <div class="hud">
    <button class="quit-btn" onclick="quitGame()">✖ Quit</button>
    <div class="hud-item score">⭐ <span id="xp-counter">0</span> XP</div>
    <div class="hud-item lives" id="lives-display">❤️❤️❤️</div>
  </div>
  <div class="progress-container">
    <div class="progress-bar" id="game-progress"></div>
  </div>

  <div class="stage">
    
    <!-- Active Question Card -->
    <div class="game-card" id="question-screen">
      <span class="meta-tag" id="q-meta">Loading...</span>
      <div class="question-text" id="q-text">Setting up your game...</div>
      
      <div class="options-grid" id="q-options">
        <!-- Buttons injected by JS -->
      </div>

      <div class="feedback-panel" id="feedback">
        <strong>Explanation:</strong> <span id="explanation-text"></span>
      </div>
      
      <button class="next-btn" id="next-btn" style="display:none;" onclick="loadNextQuestion()">Next Question ➔</button>
    </div>

    <!-- End of Game Screen -->
    <div class="game-card" id="end-screen">
      <div class="reward-icon" id="end-icon">🏆</div>
      <h1 id="end-title">Level Complete!</h1>
      <p style="font-size: 1.2em; color: #b2bec3;">You earned <strong id="earned-xp" style="color:var(--accent);">0 XP</strong></p>
      <button class="next-btn" style="display:block; margin-top: 30px;" onclick="quitGame()">Return to Hub</button>
    </div>

  </div>

  <script>
   // Game State Variables
    let gameQuestions = [];
    let currentIndex = 0;
    let sessionXP = 0;
    let lives = 3;
    
    // Parse URL Parameters
    const urlParams = new URLSearchParams(window.location.search);
    const targetSubject = urlParams.get('subject');
    const targetCategory = urlParams.get('category');
    const targetTopic = urlParams.get('topic');
    const targetLevel = urlParams.get('level');
    const targetDiff = urlParams.get('diff');

    async function initGame() {
  try {
    const res = await fetch('/api/questions?nocache=' + new Date().getTime());
    const allQuestions = await res.json();
    
    // 1. Filter by Subject, Category, and Topic
    if(targetTopic && targetCategory && targetSubject) {
      gameQuestions = allQuestions.filter(q => 
        q.subject.toLowerCase() === targetSubject.toLowerCase() && 
        q.category.toLowerCase() === targetCategory.toLowerCase() &&
        q.topic.toLowerCase() === targetTopic.toLowerCase()
      );
    } else if (targetCategory && targetSubject) {
      // Fallback if no topic is selected
      gameQuestions = allQuestions.filter(q => 
        q.subject.toLowerCase() === targetSubject.toLowerCase() && 
        q.category.toLowerCase() === targetCategory.toLowerCase()
      );
    } else if (targetSubject) {
      // Fallback for daily challenge (Subject only)
      gameQuestions = allQuestions.filter(q => 
        q.subject.toLowerCase() === targetSubject.toLowerCase()
      );
    }

    // 2. Apply Level and Difficulty Filters
    if (targetLevel && targetLevel !== 'All') {
      gameQuestions = gameQuestions.filter(q => q.level.toLowerCase() === targetLevel.toLowerCase());
    }
    if (targetDiff && targetDiff !== 'All') {
      gameQuestions = gameQuestions.filter(q => parseInt(q.difficulty) === parseInt(targetDiff));
    }

    if(gameQuestions.length === 0) {
      document.getElementById('q-text').innerText = "No questions match your selected difficulty!";
      return;
    }

    // 3. Shuffle the entire filtered pool
    gameQuestions.sort(() => Math.random() - 0.5);

    // 4. Slice exactly 10 questions
    gameQuestions = gameQuestions.slice(0, 10);

    loadQuestion();
  } catch (error) {
    document.getElementById('q-text').innerText = "Error loading database.";
  }
}

   function loadQuestion() {
  const q = gameQuestions[currentIndex];
  
  // Update HUD & Progress
  document.getElementById('game-progress').style.width = `${((currentIndex) / gameQuestions.length) * 100}%`;
  document.getElementById('q-meta').innerText = `${q.subject} • ${q.category} • Level ${q.level}`;
  
  const questionText = q.question || q.question_text || "Error: Question text missing";
  document.getElementById('q-text').innerHTML = questionText; 
  
  // Reset Options
  const optionsBox = document.getElementById('q-options');
  optionsBox.innerHTML = '';
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';

  // 1. Safely Parse the MathJax JSON
  let optionsArray = [];
  try {
    let optString = q.options;
    if (typeof optString === 'string') {
      optString = optString.replace(/\\/g, '\\\\');
      optionsArray = JSON.parse(optString);
    } else {
      optionsArray = optString;
    }
  } catch(e) {
    optionsArray = ["Error loading options"]; 
  }

  // 2. Package the options with a flag so we don't lose the correct one when shuffled
  const originalCorrectIndex = parseInt(q.correct);
  let shufflePool = optionsArray.map((text, index) => {
    return { text: text, isCorrect: (index === originalCorrectIndex) };
  });
  
  // 3. Shuffle the array randomly
  shufflePool.sort(() => Math.random() - 0.5);

  // 4. Find where the correct answer ended up after the shuffle
  const newCorrectIndex = shufflePool.findIndex(opt => opt.isCorrect);

  // 5. Generate the buttons safely
  shufflePool.forEach((opt, index) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = opt.text;
    
    btn.onclick = () => checkAnswer(index, newCorrectIndex, btn, q.explanation);
    
    optionsBox.appendChild(btn);
  });

  // Trigger MathJax formatting
  if (window.MathJax) { MathJax.typesetPromise(); }
}

    function checkAnswer(selectedIndex, correctIndex, clickedBtn, explanation) {
      const buttons = document.querySelectorAll('.option-btn');
      const isCorrect = (selectedIndex === correctIndex);

      buttons.forEach((btn, idx) => {
        btn.disabled = true; // Lock all buttons
        if (idx === correctIndex) btn.classList.add('correct');
        else if (idx === selectedIndex && !isCorrect) btn.classList.add('wrong');
      });

      if (isCorrect) {
        sessionXP += 15;
        document.getElementById('xp-counter').innerText = sessionXP;
      } else {
        lives--;
        updateLivesDisplay();
        sessionXP += 5; // Reward for trying
        document.getElementById('xp-counter').innerText = sessionXP;
      }

      // Show explanation if it exists
      if (explanation && explanation.length > 2) {
        document.getElementById('explanation-text').innerHTML = explanation;
        document.getElementById('feedback').style.display = 'block';
        if (window.MathJax) { MathJax.typesetPromise(); }
      }

      document.getElementById('next-btn').style.display = 'block';
    }

    function updateLivesDisplay() {
      let hearts = '';
      for(let i=0; i<lives; i++) hearts += '❤️';
      for(let i=lives; i<3; i++) hearts += '🖤'; // Empty hearts
      document.getElementById('lives-display').innerText = hearts;

      if (lives <= 0) {
        setTimeout(gameOver, 1000);
      }
    }

    function loadNextQuestion() {
      currentIndex++;
      if (currentIndex >= gameQuestions.length) {
        gameWon();
      } else {
        loadQuestion();
      }
    }

    function gameOver() {
      document.getElementById('question-screen').style.display = 'none';
      document.getElementById('end-screen').style.display = 'block';
      document.getElementById('end-icon').innerText = '💀';
      document.getElementById('end-title').innerText = 'Out of Lives!';
      document.getElementById('end-title').style.color = 'var(--danger)';
      finalizeXP();
    }

    function gameWon() {
      document.getElementById('question-screen').style.display = 'none';
      document.getElementById('end-screen').style.display = 'block';
      document.getElementById('end-icon').innerText = '👑';
      document.getElementById('end-title').innerText = 'Level Complete!';
      document.getElementById('end-title').style.color = 'var(--accent)';
      document.getElementById('game-progress').style.width = '100%';
      finalizeXP();
    }

    function finalizeXP() {
      document.getElementById('earned-xp').innerText = `${sessionXP} XP`;
      // Save to local storage for now (Will be replaced by Database API when we add Login)
      let totalXP = parseInt(localStorage.getItem('brainhub_xp')) || 0;
      localStorage.setItem('brainhub_xp', totalXP + sessionXP);
    }

    function quitGame() {
      // Go back to the specific subject hub
      if(targetSubject) {
        window.location.href = `/${targetSubject.toLowerCase()}.html`;
      } else {
        window.location.href = '/';
      }
    }

    // Boot the game
    initGame();
  </script>
</body>
</html>
