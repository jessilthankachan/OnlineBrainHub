<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select a Stage - Online Brain Hub</title>
  <style>
    :root { --bg: #1e272e; --panel: #2d3436; --primary: #0984e3; --accent: #fdcb6e; --text: #f5f6fa; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    
    .top-nav { max-width: 1200px; margin: 0 auto 20px auto; }
    .back-btn { color: var(--primary); text-decoration: none; font-weight: bold; display: inline-block; }
    .back-btn:hover { text-decoration: underline; }

    /* Two-Column Layout */
    .page-layout {
      display: flex;
      gap: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Main Content Area */
    .main-content {
      flex: 1; /* Takes up all remaining space */
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Sidebar for Sticky Ad */
    .sidebar {
      width: 300px; /* Standard width for sidebar ads */
      flex-shrink: 0;
    }

    /* Ad Placeholders */
    .ad-space {
      background: #353b48;
      border: 2px dashed #7f8fa6;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7f8fa6;
      font-weight: bold;
      text-align: center;
    }
    
    /* Top Banner: Standard 728x90 or flexible */
    .top-ad {
      width: 100%;
      min-height: 90px;
    }

    /* Right Sticky Ad: Standard 300x600 */
    .sticky-ad {
      width: 100%;
      height: 600px;
      position: sticky;
      top: 20px; /* Sticks 20px from the top of the screen when scrolling down */
    }

    /* Button Grid (2 or 3 per row depending on screen size) */
    .button-grid {
      display: grid;
      /* auto-fill + minmax handles the 2 or 3 buttons per row automatically */
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      background: var(--panel);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .play-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 20px;
      border-radius: 10px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 0 #273c75;
      text-align: center;
    }
    .play-btn:hover { background: #0097e6; transform: translateY(-2px); box-shadow: 0 6px 0 #273c75; }
    .play-btn:active { transform: translateY(4px); box-shadow: none; }

    h1 { margin: 0 0 15px 0; color: var(--accent); }

    /* Mobile Responsiveness */
    @media(max-width: 850px) {
      .page-layout { flex-direction: column; }
      .sidebar { width: 100%; }
      .sticky-ad { position: static; height: 250px; } /* Disables sticky behavior on mobile so it doesn't cover the screen */
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="/" class="back-btn">← Back to Hub</a>
  </div>

  <div class="page-layout">
    
    <!-- LEFT SIDE: Main Content -->
    <div class="main-content">
      
      <!-- Top Ad Banner Placeholder -->
      <div class="ad-space top-ad">
        Top Banner Ad (e.g. 728x90)<br>
        <!-- Insert Google AdSense <script> here later -->
      </div>

      <div class="button-grid" id="stage-container">
        <h1 style="grid-column: 1 / -1;" id="page-title">Select a Stage</h1>
        
        <!-- Example Buttons: These will wrap 2 or 3 to a row automatically -->
        <button class="play-btn" onclick="startQuiz('Stage 1')">Stage 1</button>
        <button class="play-btn" onclick="startQuiz('Stage 2')">Stage 2</button>
        <button class="play-btn" onclick="startQuiz('Stage 3')">Stage 3</button>
        <button class="play-btn" onclick="startQuiz('Stage 4')">Stage 4</button>
        <button class="play-btn" onclick="startQuiz('Stage 5')">Stage 5</button>
        <!-- Add as many as you need here, or inject them via JavaScript -->

      </div>
    </div>

    <!-- RIGHT SIDE: Sidebar -->
    <div class="sidebar">
      
      <!-- Sticky Sidebar Ad Placeholder -->
      <div class="ad-space sticky-ad">
        Right Sidebar Ad (e.g. 300x600)<br>
        Scroll down to see me stick!<br>
        <!-- Insert Google AdSense <script> here later -->
      </div>

    </div>

  </div>

  <script>
    // Set the title dynamically if needed
    const urlParams = new URLSearchParams(window.location.search);
    const currentSubject = urlParams.get('subject') || 'Subject';
    document.getElementById('page-title').innerText = `${currentSubject} Stages`;

    function startQuiz(stageName) {
      // 1. Grab current URL context
      const subject = urlParams.get('subject') || '';
      const category = urlParams.get('category') || '';
      
      // 2. We use the button's stageName as the 'topic'
      let quizUrl = `/quiz.html?subject=${encodeURIComponent(subject)}&topic=${encodeURIComponent(stageName)}`;
      
      if (category) {
        quizUrl += `&category=${encodeURIComponent(category)}`;
      }

      // 3. Route to the game
      window.location.href = quizUrl;
    }
  </script>
</body>
</html>
