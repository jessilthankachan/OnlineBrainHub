<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Level - Online Brain Hub</title>
  <style>
    :root {
      --bg-color: #1e272e;
      --panel-bg: #2d3436;
      --primary: #0984e3;
      --accent: #fdcb6e;
      --text: #f5f6fa;
    }
    
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--bg-color); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box;}
    
    header { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; margin-top: 10px;}
    .back-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s;}
    .back-btn:hover { background: rgba(255,255,255,0.2); }
    
    /* Layout structure for Ads */
    .page-layout { display: flex; gap: 30px; max-width: 1200px; width: 100%; flex: 1; }
    .main-content { flex: 1; display: flex; flex-direction: column; gap: 20px; }
    .sidebar { width: 300px; flex-shrink: 0; }

    /* Ad Placeholders */
    .ad-space { background: rgba(0,0,0,0.2); border: 2px dashed rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #b2bec3; font-weight: bold; text-align: center; }
    .top-ad { width: 100%; min-height: 90px; }
    .sticky-ad { width: 100%; height: 600px; position: sticky; top: 20px; }

    .stage-header { text-align: center; margin-bottom: 10px; }
    .world-title { font-size: 1.2em; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; margin: 0; font-weight: 800;}
    .category-title { font-size: 2.5em; margin: 10px 0; text-shadow: 0 4px 10px rgba(0,0,0,0.5);}

    /* Game Level Grid */
    .level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; width: 100%; }
    .level-card { background: var(--panel-bg); border-radius: 20px; padding: 30px 20px; text-align: center; cursor: pointer; border: 3px solid transparent; box-shadow: 0 8px 0 rgba(0,0,0,0.2); transition: all 0.2s ease; position: relative; overflow: hidden;}
    .level-card:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 13px 0 rgba(0,0,0,0.2);}
    .level-card:active { transform: translateY(3px); box-shadow: 0 0px 0 rgba(0,0,0,0.2); }
    
    .level-icon { font-size: 3em; margin-bottom: 15px; display: block;}
    .level-name { font-size: 1.4em; font-weight: bold; margin: 0;}
    
    .loading { font-size: 1.5em; color: var(--accent); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    @media(max-width: 900px) {
      .page-layout { flex-direction: column; }
      .sidebar { width: 100%; }
      .sticky-ad { position: static; height: 250px; }
    }
  </style>
</head>
<body>

  <header>
    <!-- Dynamic Back Button -->
    <button class="back-btn" onclick="window.history.back()">← Back</button>
    <div style="font-weight: bold; color: var(--accent);">⭐ Select a Stage</div>
  </header>

  <div class="page-layout">
    
    <!-- LEFT SIDE: Main Content -->
    <div class="main-content">
      
      <div class="ad-space top-ad">
        Top Banner Ad (e.g. 728x90)
      </div>

      <div class="stage-header">
        <h3 class="world-title" id="world-title">Loading World...</h3>
        <h1 class="category-title" id="category-title">Select Level</h1>
      </div>

      <!-- In-Page Filters (Difficulty Only) -->
      <div style="background: var(--panel-bg); padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
        <div>
          <label style="color: var(--accent); font-weight: bold; margin-right: 10px;">Difficulty:</label>
          <select id="diff-filter" onchange="applyFilters()" style="padding: 8px; border-radius: 5px; background: #353b48; color: white; border: 1px solid #7f8fa6; outline: none; cursor: pointer;">
            <option value="All">All Difficulties</option>
            <option value="1">Difficulty 1</option>
            <option value="5">Difficulty 5</option>
            <option value="10">Difficulty 10</option>
          </select>
        </div>
      </div>

      <div class="level-grid" id="level-grid">
        <div class="loading">Generating levels from database...</div>
      </div>
      
    </div>

    <!-- RIGHT SIDE: Sidebar Ad -->
    <div class="sidebar">
      <div class="ad-space sticky-ad">
        Right Sidebar Ad (e.g. 300x600)<br>
        Scroll down to see me stick!
      </div>
    </div>

  </div>

  <script>
    // Global variable to store all fetched questions
    let globalQuestions = [];
    
    // Parse URL Parameters
    const urlParams = new URLSearchParams(window.location.search);
    const targetSubject = urlParams.get('subject');
    const targetCategory = urlParams.get('category');
    const urlDiff = urlParams.get('diff') || 'All';

    // 1. Check if we arrived here correctly
    if (!targetSubject || !targetCategory) {
      document.getElementById('world-title').innerText = "Navigation Error";
      document.getElementById('category-title').innerText = "Missing Data";
      document.getElementById('level-grid').innerHTML = '<div style="text-align:center; grid-column: 1 / -1; color: #ff7675;">Please start from a subject page!</div>';
    } else {
      document.getElementById('world-title').innerText = `${targetSubject} World`;
      document.getElementById('category-title').innerText = targetCategory;
      
      // Set dropdown menu to match the URL parameters passed from the previous page
      document.getElementById('diff-filter').value = urlDiff;
      
      bootSystem();
    }

    async function bootSystem() {
      try {
        // Send the smart filters directly to the backend to bypass safety limits!
        const apiUrl = `/api/questions?subject=${encodeURIComponent(targetSubject)}&category=${encodeURIComponent(targetCategory)}&nocache=${new Date().getTime()}`;
        
        const res = await fetch(apiUrl);
        globalQuestions = await res.json();
        
        applyFilters(); // Draw the grid based on the newly fetched data
      } catch (error) {
        document.getElementById('level-grid').innerHTML = '<div style="text-align:center; grid-column: 1 / -1; color: #ff7675;">Error connecting to the game server.</div>';
      }
    }

    // Triggered when a player changes the dropdown menus on this page
    function applyFilters() {
      if(globalQuestions.length === 0) return;

      const selectedDiff = document.getElementById('diff-filter').value;

      // Filter by Subject and Category
      let filteredQuestions = globalQuestions.filter(q => 
        q.subject.toLowerCase() === targetSubject.toLowerCase() && 
        q.category.toLowerCase() === targetCategory.toLowerCase()
      );

      // Apply Difficulty Filter
      if (selectedDiff !== 'All') {
        filteredQuestions = filteredQuestions.filter(q => parseInt(q.difficulty) === parseInt(selectedDiff));
      }

      const grid = document.getElementById('level-grid');
      grid.innerHTML = ''; 

      if (filteredQuestions.length === 0) {
        grid.innerHTML = '<div style="text-align:center; grid-column: 1 / -1; color: #ff7675; font-size: 1.2em; padding: 20px;">No stages unlocked for this combination! Try changing your filters above.</div>';
        return;
      }

      const topicMap = {};
      filteredQuestions.forEach(q => {
        if (!topicMap[q.topic]) topicMap[q.topic] = 0;
        topicMap[q.topic]++;
      });

      const icons = ['🎯', '⚡', '🚀', '🔥', '🧩', '⚔️', '🔮', '🏆'];
      let iconIndex = 0;

      for (const [topicName, qCount] of Object.entries(topicMap)) {
        const card = document.createElement('div');
        card.className = 'level-card';
        const icon = icons[iconIndex % icons.length];
        iconIndex++;

        card.innerHTML = `
          <span class="level-icon">${icon}</span>
          <h3 class="level-name">${topicName}</h3>
        `;
        
        card.onclick = () => {
          window.location.href = `/quiz.html?subject=${encodeURIComponent(targetSubject)}&category=${encodeURIComponent(targetCategory)}&topic=${encodeURIComponent(topicName)}&diff=${encodeURIComponent(selectedDiff)}`;
        };
        
        grid.appendChild(card);
      }
    }
  </script>
</body>
</html>
